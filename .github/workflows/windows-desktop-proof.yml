name: Windows Desktop Proof (manual)

# Manual-only proof lane. This workflow never runs on push or pull_request,
# so it cannot affect required PR/merge CI. It targets a fixed self-hosted
# label reserved for an unlocked, interactive Windows desktop. Generic hosted
# runners do not guarantee compositor-backed app-window capture.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  desktop-proof:
    runs-on: [self-hosted, windows, openclaw-desktop-proof]
    steps:
    - name: Verify active interactive desktop
      shell: pwsh
      run: |
        $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
        if ($sessionId -eq 0 -or -not [Environment]::UserInteractive) {
          throw "Desktop proof requires an interactive non-Session-0 runner process."
        }

        $session = & "$env:SystemRoot\System32\qwinsta.exe" $sessionId 2>&1 | Out-String
        if ($LASTEXITCODE -ne 0 -or $session -notmatch '(?im)\bActive\b') {
          throw "Desktop proof requires an active, connected desktop session. qwinsta output: $session"
        }

    - uses: actions/checkout@v7

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install WindowsAppRuntime
      shell: pwsh
      run: |
        [xml]$props = Get-Content (Join-Path $env:GITHUB_WORKSPACE "Directory.Build.props")
        $versionNode = $props.SelectSingleNode("/Project/PropertyGroup/MicrosoftWindowsAppSDKVersion")
        if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
          throw "MicrosoftWindowsAppSDKVersion was not found in Directory.Build.props"
        }

        $version = $versionNode.InnerText.Trim()
        $channel = [regex]::Match($version, '^\d+\.\d+').Value
        if ([string]::IsNullOrWhiteSpace($channel)) {
          throw "Cannot derive WindowsAppRuntime channel from MicrosoftWindowsAppSDKVersion '$version'"
        }

        $url = "https://aka.ms/windowsappsdk/$channel/$version/windowsappruntimeinstall-x64.exe"
        Write-Host "Installing WindowsAppRuntime $version from $url"
        $exe = "$env:RUNNER_TEMP\WindowsAppRuntimeInstall.exe"
        Invoke-WebRequest -Uri $url -OutFile $exe
        & $exe --quiet
        if ($LASTEXITCODE -ne 0) { throw "WindowsAppRuntimeInstall failed with exit code $LASTEXITCODE" }

    - name: Restore dependencies
      run: dotnet restore

    - name: Capture Windows desktop proof
      id: proof
      shell: pwsh
      run: |
        $env:OPENCLAW_REPO_ROOT = (Get-Location).Path
        .\scripts\capture-windows-desktop-proof.ps1 `
          -Configuration "${{ inputs.configuration }}" `
          -ArtifactRoot "TestResults\DesktopProof"

    # Uploaded unconditionally so a failing/fail-closed run still publishes
    # its manifest and diagnostics; a missing artifact upload must never be
    # the only trace of a capture attempt.
    - name: Upload desktop proof artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-desktop-proof
        path: |
          TestResults/DesktopProof/**
          !TestResults/DesktopProof/**/*.trx
        if-no-files-found: error
